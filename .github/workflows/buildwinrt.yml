name: Dolphin WinRT Builds 
on:
  push:
    branches:
      - master
      - actions
      - xbox-dolphinbar
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: ['Release']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up NuGet
      uses: NuGet/setup-nuget@v2

    - name: Extract version string from AppxManifest
      id: extract_version
      run: |
        $manifest = [xml](Get-Content Source\DolphinWinRT\Package.appxmanifest)
        $version = $manifest.Package.Identity.Version
        echo $version
        echo version=$version >> $env:GITHUB_OUTPUT
        
    - name: Echo the GitHub Env for File Names
      run: |
        echo "${{ steps.extract_version.outputs.version }}"

    - name: Restore NuGet packages
      run: nuget restore Source/dolphin-emu.sln

    # Signed with the fixed key in Source/DolphinWinRT (CN=SternXD, password dolphinuwp), the same
    # every build, so a new version installs over the old one and keeps its settings and Game mode.

    # The app project packs "Sys\**" but only copies Data\Sys there in its pre-build step, after
    # the file list is made, so on a fresh checkout the package had no Sys folder and Dolphin
    # closed right after the splash screen. Put it in place first.
    - name: Copy Sys into the app project
      shell: pwsh
      run: |
        robocopy Data\Sys Source\DolphinWinRT\Sys /E /XF *.vsh /R:0 /W:0 /NFL /NDL /NJH
        if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
        $count = (Get-ChildItem -Recurse -File Source\DolphinWinRT\Sys).Count
        Write-Host "Sys files: $count"
        exit 0

    # Only the Xbox app (and what it needs): the desktop tools in the solution don't build here.
    - name: Build the project
      run: msbuild Source/dolphin-emu.sln /m /p:PlatformToolset=v143 /t:DolphinWinRT /p:Configuration="${{ matrix.configuration }}" /p:Platform=x64 /p:RestorePackagesConfig=true /p:PackageCertificatePassword=dolphinuwp
  
    - name: Check the package has Dolphin's Sys files
      shell: pwsh
      run: |
        $bundle = Get-ChildItem -Recurse Source\AppPackages -Filter *.msixbundle | Select-Object -First 1
        $mb = [math]::Round($bundle.Length / 1MB, 1)
        Write-Host "$($bundle.Name): $mb MB"
        if ($bundle.Length -lt 30MB) { Write-Host "Package is too small - Sys folder missing?"; exit 1 }

    - name: Upload APPX file
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: appx-${{ matrix.configuration }}
        path: |
          Source/AppPackages/**/*.msixbundle
          Source/AppPackages/**/Dependencies/x64/*.appx
          Source/AppPackages/**/*.cer
        if-no-files-found: error

    # Frank's Xbox build: the install files on a fixed "latest" release, ready to download (no zip)
    - name: Replace the latest release
      if: matrix.configuration == 'Release' && github.event_name != 'pull_request'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Get-ChildItem -Recurse Source\AppPackages -Include *.msixbundle,*.cer | Copy-Item -Destination dist
        Get-ChildItem -Recurse Source\AppPackages -Filter *.appx | Where-Object { $_.FullName -match '\\Dependencies\\x64\\' } | Copy-Item -Destination dist
        Get-ChildItem dist
        gh release delete latest --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
        $notes = "Dolphin for Xbox, latest build of commit $($env:GITHUB_SHA.Substring(0,7)). On the Xbox Device Portal, add the Dolphin .msixbundle and add the .appx files as its dependencies, then set it to Game."
        gh release create latest (Get-ChildItem dist).FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dolphin (latest build)" --notes $notes
        exit 0
