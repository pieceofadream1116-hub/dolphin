name: Dolphin WinRT Builds 
on:
  push:
    branches:
      - master
      - actions
      - xbox-dolphinbar
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: ['Release']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up NuGet
      uses: NuGet/setup-nuget@v2

    - name: Extract version string from AppxManifest
      id: extract_version
      run: |
        $manifest = [xml](Get-Content Source\DolphinWinRT\Package.appxmanifest)
        $version = $manifest.Package.Identity.Version
        echo $version
        echo version=$version >> $env:GITHUB_OUTPUT
        
    - name: Echo the GitHub Env for File Names
      run: |
        echo "${{ steps.extract_version.outputs.version }}"

    - name: Restore NuGet packages
      run: nuget restore Source/dolphin-emu.sln

    # The signing key in the repo has expired (APPX0108), so make a fresh one with the same
    # publisher name for every build. Dev Mode installs don't need a trusted certificate.
    - name: Make a signing certificate
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=SternXD" -KeyUsage DigitalSignature `
          -FriendlyName "DolphinUWP" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5) `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        $pw = ConvertTo-SecureString -String "dolphinuwp" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath Source\DolphinWinRT\DolphinWinRT_TemporaryKey.pfx -Password $pw | Out-Null

    # Only the Xbox app (and what it needs): the desktop tools in the solution don't build here.
    - name: Build the project
      run: msbuild Source/dolphin-emu.sln /m /p:PlatformToolset=v143 /t:DolphinWinRT /p:Configuration="${{ matrix.configuration }}" /p:Platform=x64 /p:RestorePackagesConfig=true /p:PackageCertificatePassword=dolphinuwp
  
    - name: Upload APPX file
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: appx-${{ matrix.configuration }}
        path: |
          Source/AppPackages/**/*.msixbundle
          Source/AppPackages/**/Dependencies/x64/*.appx
          Source/AppPackages/**/*.cer
        if-no-files-found: error
