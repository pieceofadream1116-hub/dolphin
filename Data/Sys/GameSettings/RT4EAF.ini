*"Spellbind" means you have a chance to forge a pact. It does not mean always succeed at pacts. The code starts off with "never spellbind". Hold - and press up to change the code to Always Spellbind; you can let go once you press the buttons and it will remember to keep spellbinding. Hold - and press down to change the code to Never Spellbind. The game pauses while you hold -. You can only forge a pact with one monster per fight, so if you spellbind multiple monsters, the one you get to pact with is random (i.e. never the one you wanted). Try to turn Always Spellbind on ONLY when you are about to kill a monster that you want to capture. Or leave it on all the time if you don't care what monsters you pact with.
